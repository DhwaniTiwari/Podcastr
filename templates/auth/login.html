<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Podcastr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
            color: #111827;
        }
    </style>
</head>

<body class="flex items-center justify-center h-screen">
    <div style="position: fixed; inset: 0; z-index: -1; background-image: url('/static/background.png'); background-size: cover; background-position: center;"></div>
    <div class="w-full max-w-md p-8 bg-white rounded-xl border border-gray-200 shadow-xl relative z-10">
        <div class="flex items-center gap-2 mb-8">
            <div class="w-8 h-8 rounded bg-orange-500"></div>
            <span class="text-2xl font-bold">Podcastr</span>
        </div>

        <h1 class="text-xl font-bold mb-2">Log in to your account</h1>
        <p class="text-gray-500 mb-6 text-sm">Welcome back! Please enter your details.</p>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-500 p-3 rounded-lg mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/login" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:border-orange-500 transition-colors placeholder-gray-400">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:border-orange-500 transition-colors placeholder-gray-400">
            </div>

            <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition-colors">
                Log In
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-500">
            Don't have an account?
            <a href="/auth/register" class="text-orange-500 hover:text-orange-400 font-medium">Sign up</a>
        </p>
    </div>
</body>

</html>
