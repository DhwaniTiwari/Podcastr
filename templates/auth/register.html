<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Podcastr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #101114;
            color: white;
        }
    </style>
</head>

<body class="flex items-center justify-center h-screen">
    <div class="w-full max-w-md p-8 bg-[#1C1F26] rounded-xl border border-[#2D3039] shadow-2xl">
        <div class="flex items-center gap-2 mb-8">
            <div class="w-8 h-8 rounded bg-orange-500"></div>
            <span class="text-2xl font-bold">Podcastr</span>
        </div>

        <h1 class="text-xl font-bold mb-2">Create an account</h1>
        <p class="text-gray-400 mb-6 text-sm">Start creating AI-powered podcasts today.</p>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-500 p-3 rounded-lg mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/register" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Full Name</label>
                <input type="text" name="full_name" required placeholder="John Doe"
                    class="w-full bg-[#15171C] border border-[#2D3039] rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-orange-500 transition-colors placeholder-gray-600">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full bg-[#15171C] border border-[#2D3039] rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-orange-500 transition-colors placeholder-gray-600">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-[#15171C] border border-[#2D3039] rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-orange-500 transition-colors placeholder-gray-600">
            </div>

            <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition-colors">
                Sign Up
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-400">
            Already have an account?
            <a href="/auth/login" class="text-orange-500 hover:text-orange-400 font-medium">Log in</a>
        </p>
    </div>
</body>

</html>
